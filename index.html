<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cardápio Digital</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================
         CABEÇALHO
    ====================================== -->

    <header>


        <!-- =====================================
             IDENTIDADE / FRASE
        ====================================== -->

        <div class="logo">

            <span>
                Sabores que conectam
            </span>

        </div>


        <!-- =====================================
             PESQUISA
        ====================================== -->

        <div class="pesquisa">

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar prato..."
            >

        </div>


        <!-- =====================================
             LOGO DO RESTAURANTE
        ====================================== -->

        <img
            src="imagens/logo.png"
            alt="Logo do restaurante"
            class="logo-restaurante"
        >


    </header>



    <!-- =====================================
         BANNER
    ====================================== -->

    <section class="banner">

        <div class="texto">

            <h2>
                Bem-vindo!
            </h2>

            <p>
                Escolha entre nossos deliciosos pratos preparados
                com ingredientes selecionados.
            </p>

        </div>

    </section>



    <!-- =====================================
         CATEGORIAS
    ====================================== -->

    <section class="categorias">


        <button
            class="categoria ativa"
            data-categoria="Todos"
        >
            Todos
        </button>


        <button
            class="categoria"
            data-categoria="Entradas"
        >
            Entradas
        </button>


        <button
            class="categoria"
            data-categoria="Pratos Principais"
        >
            Pratos Principais
        </button>


        <button
            class="categoria"
            data-categoria="Bebidas"
        >
            Bebidas
        </button>


        <button
            class="categoria"
            data-categoria="Sobremesas"
        >
            Sobremesas
        </button>


    </section>



    <!-- =====================================
         LISTA DE PRATOS
    ====================================== -->

    <main>

        <div id="listaPratos"></div>

    </main>



    <!-- =====================================
         MODAL DO PRATO
    ====================================== -->

    <div
        id="modal"
        class="modal"
    >


        <div class="modal-content">


            <!-- FECHAR -->

            <span id="fecharModal">
                &times;
            </span>


            <!-- IMAGEM -->

            <img
                id="modalImagem"
                src=""
                alt="Prato"
            >


            <!-- NOME -->

            <h2 id="modalNome"></h2>


            <!-- DESCRIÇÃO -->

            <p id="modalDescricao"></p>


            <!-- QUANTIDADE -->

            <div
                id="modalQuantidade"
                class="modal-quantidade"
            ></div>


            <!-- INFORMAÇÕES -->

            <div class="modal-infos">


                <span id="modalCategoria"></span>


                <span id="modalPreco"></span>


            </div>



            <!-- =====================================
                 PREÇOS POR TAMANHO
            ====================================== -->

            <div
                id="modalPrecosTamanho"
                class="precos-tamanho"
            >


                <div
                    id="modalPrecoPequeno"
                    class="preco-tamanho"
                ></div>


                <div
                    id="modalPrecoMedio"
                    class="preco-tamanho"
                ></div>


                <div
                    id="modalPrecoGrande"
                    class="preco-tamanho"
                ></div>


            </div>



            <!-- =====================================
                 ALERGIAS
            ====================================== -->

            <div
                id="modalAlergias"
                class="modal-alergias"
            ></div>


        </div>


    </div>



    <!-- =====================================
         MODELO DO CARD
    ====================================== -->

    <template id="cardTemplate">


        <div class="card">


            <!-- =====================================
                 IMAGEM
            ====================================== -->

            <div class="imagem">

                <img
                    src=""
                    alt="Prato"
                >

            </div>



            <!-- =====================================
                 CONTEÚDO
            ====================================== -->

            <div class="conteudo">


                <!-- NOME -->

                <h3 class="nome"></h3>


                <!-- DESCRIÇÃO -->

                <p class="descricao"></p>


                <!-- QUANTIDADE -->

                <span class="quantidade"></span>


                <!-- CATEGORIA -->

                <span class="categoria"></span>


                <!-- =====================================
                     PREÇO
                ====================================== -->

                <div class="rodape">

                    <span class="preco"></span>

                </div>



                <!-- =====================================
                     PREÇOS POR TAMANHO
                ====================================== -->

                <div class="precos-tamanho">


                    <span class="preco-pequeno"></span>


                    <span class="preco-medio"></span>


                    <span class="preco-grande"></span>


                </div>



                <!-- =====================================
                     ALERGIAS DO PRATO
                ====================================== -->

                <div class="alergias"></div>


            </div>


        </div>


    </template>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="js/cliente.js"></script>


</body>

</html>
