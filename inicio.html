<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cardápio</title>

    <link rel="stylesheet" href="css/inicio.css">

</head>

<body>

    <main class="pagina-inicial">

        <!-- LOGO -->

        <section class="cabecalho">

            <div class="icone">

                🍴

            </div>

            <h1>Cardápio</h1>

            <p>Sabores que conectam</p>

        </section>


        <!-- CONTEÚDO PRINCIPAL -->

        <section class="escolha">

            <h2>Bem-vindo!</h2>

            <p>
                Escolha qual área deseja acessar.
            </p>


            <!-- ÁREA DO CLIENTE -->

            <button
                class="opcao cliente"
                id="acessarCliente">

                <span class="emoji">

                    🍽️

                </span>

                <span class="texto">

                    <strong>
                        Ver Cardápio
                    </strong>

                    <small>
                        Veja nossos pratos e sabores
                    </small>

                </span>

                <span class="seta">

                    →

                </span>

            </button>


            <!-- ÁREA DO GASTRÔNOMO -->

            <button
                class="opcao administrador"
                id="acessarAdmin">

                <span class="emoji">

                    ⚙️

                </span>

                <span class="texto">

                    <strong>
                        Área do Gastrônomo
                    </strong>

                    <small>
                        Gerencie pratos e cardápio
                    </small>

                </span>

                <span class="seta">

                    →

                </span>

            </button>

        </section>


        <!-- RODAPÉ -->

        <footer>

            <p>
                🍴 Sistema de Gerenciamento de Cardápio
            </p>

        </footer>

    </main>


    <script src="js/inicio.js"></script>

</body>

</html>
